<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | EXF</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="icon" type="image/jpg" href="ship.jpg" />
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
       background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/></pattern></defs><rect width="100" height="100" fill="url(%23grid)"/></svg>');
      animation: gridMove 30s linear infinite;
    }

    @keyframes gridMove {
      0% { transform: translate(0, 0); }
      100% { transform: translate(10px, 10px); }
    }

    .login-page {
      width: 100%;
      max-width: 380px;
      position: relative;
      z-index: 1;
    }

    .form-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(25px);
      border-radius: 24px;
      padding: 10px 40px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.3);
      position: relative;
      overflow: hidden;
    }

    .form-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #4facfe, #00f2fe, #43e97b);
      border-radius: 24px 24px 0 0;
    }

    .form-card::after {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(79, 172, 254, 0.05) 0%, transparent 70%);
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.3; }
      50% { transform: scale(1.1) rotate(180deg); opacity: 0.1; }
    }

    .logo-bar {
      text-align: center;
      margin-bottom: 35px;
      position: relative;
      z-index: 2;
    }

    .logo {
      max-height: 65px;
      max-width: 220px;
      height: auto;
      width: auto;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.1));
      transition: transform 0.3s ease;
    }

    .logo:hover {
      transform: scale(1.05);
    }

    h2 {
      text-align: center;
      color: #1a202c;
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
      position: relative;
      z-index: 2;
    }

    .subtitle {
      text-align: center;
      color: #718096;
      font-size: 15px;
      margin-bottom: 35px;
      font-weight: 400;
    }

    .input-group {
      position: relative;
      margin-bottom: 24px;
      z-index: 2;
    }

    .input-group input {
      width: 100%;
      padding: 18px 24px;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.9);
      color: #2d3748;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
      font-weight: 500;
    }

    .input-group input:focus {
      border-color: #4facfe;
      box-shadow: 0 0 0 4px rgba(79, 172, 254, 0.15);
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 1);
    }

    .input-group input::placeholder {
      color: #a0aec0;
      font-weight: 400;
    }

    .input-group input:not(:placeholder-shown) {
      border-color: #cbd5e0;
      background: rgba(255, 255, 255, 1);
    }

    .btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.4s ease;
      margin-top: 12px;
      position: relative;
      overflow: hidden;
      z-index: 2;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .btn:active {
      transform: translateY(-1px);
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.6s;
    }

    .btn:hover::before {
      left: 100%;
    }

    .signup-link {
      text-align: center;
      margin-top: 28px;
      color: #718096;
      font-size: 15px;
      z-index: 2;
      position: relative;
    }

    .signup-link a {
      color: #4facfe;
      text-decoration: none;
      font-weight: 700;
      transition: all 0.3s ease;
      position: relative;
    }

    .signup-link a::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, #4facfe, #00f2fe);
      transition: width 0.3s ease;
    }

    .signup-link a:hover {
      color: #00f2fe;
    }

    .signup-link a:hover::after {
      width: 100%;
    }

    .message {
      margin-top: 20px;
      padding: 16px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      min-height: 24px;
      transition: all 0.4s ease;
      position: relative;
      z-index: 2;
    }

    .message:not(:empty) {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .message:empty {
      opacity: 0;
      transform: translateY(-15px) scale(0.95);
    }

    /* Floating elements */
    .login-page::before {
      content: '';
      position: absolute;
      top: -100px;
      left: -100px;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(79, 172, 254, 0.1) 0%, transparent 70%);
      border-radius: 50%;
      animation: float1 6s ease-in-out infinite;
      z-index: 0;
    }

    .login-page::after {
      content: '';
      position: absolute;
      bottom: -150px;
      right: -150px;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(0, 242, 254, 0.08) 0%, transparent 70%);
      border-radius: 50%;
      animation: float2 8s ease-in-out infinite reverse;
      z-index: 0;
    }

    @keyframes float1 {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(30px, -30px) rotate(120deg); }
      66% { transform: translate(-20px, 20px) rotate(240deg); }
    }

    @keyframes float2 {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(-40px, -40px) rotate(180deg); }
    }

    /* Responsive design */
    @media (max-width: 480px) {
      .form-card {
        padding: 35px 28px;
        margin: 15px;
      }

      h2 {
        font-size: 28px;
      }

      .input-group input, .btn {
        padding: 16px 20px;
        font-size: 15px;
      }
    }

    /* Success and error message styles */
    .message[style*="green"] {
      background: linear-gradient(135deg, #48bb78, #38a169);
      color: white;
      border: none;
      box-shadow: 0 8px 25px rgba(72, 187, 120, 0.3);
    }

    .message[style*="red"] {
      background: linear-gradient(135deg, #f56565, #e53e3e);
      color: white;
      border: none;
      box-shadow: 0 8px 25px rgba(245, 101, 101, 0.3);
    }

    /* Welcome text animation */
    .welcome-text {
      text-align: center;
      color: #4a5568;
      font-size: 16px;
      margin-bottom: 30px;
      font-weight: 400;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="form-card">
      <div class="logo-bar">
        <img src="assets/Ship2.jpg" alt="ship Logo" class="logo" />
      </div>

      <h2>Welcome Back</h2>
      <p class="subtitle">log in to continue your journey</p>
      
      <form id="loginForm">
        <div class="input-group">
          <input type="email" id="email" placeholder="Email Address" required />
        </div>
        <div class="input-group">
          <input type="password" id="password" placeholder="Password" required />
        </div>
        <div class="g-recaptcha" data-sitekey="6Lca5TArAAAAADRedne525SsKt5jf-252ADg2uBS"></div>
        <button type="submit" class="btn">Log In</button>
      </form>

      <p class="signup-link">Don't have an account? <a href="/">Create one here</a></p>
      <div id="msg" class="message"></div>
    </div>
  </div>

  <script>
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const msgBox = document.getElementById("msg");

    // ✅ Get reCAPTCHA token from Google
    const recaptchaToken = grecaptcha.getResponse();
    if (!recaptchaToken) {
      msgBox.textContent = "Please complete the CAPTCHA.";
      msgBox.style.color = "red";
      return;
    }

    try {
      const res = await fetch("/api/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        credentials: "include", // ⬅️ send/receive cookies
        body: JSON.stringify({
          email,
          password,
          recaptcha_token: recaptchaToken  // ✅ MUST match backend key
        }),
      });

      const data = await res.json();

      if (res.ok) {
        msgBox.textContent = "Login successful! Redirecting...";
        msgBox.style.color = "green";

        // Clear CAPTCHA so user doesn’t see old token
        grecaptcha.reset();

        // ✅ Wait 1.5s, then redirect
        setTimeout(() => {
          window.location.href = "/dashboard";
        }, 1500);
      } else {
        msgBox.textContent = data.detail || "Login failed.";
        msgBox.style.color = "red";
        grecaptcha.reset(); // 🔁 Allow retry
      }
    } catch (err) {
      console.error("Login error:", err);
      msgBox.textContent = "Something went wrong.";
      msgBox.style.color = "red";
      grecaptcha.reset();
    }
  });

  // Optional: clear token if any previous attempt set it (can be removed)
  fetch("/api/clear-token", { method: "GET" }).catch(console.error);
</script>



</body>
</html>
