<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | EXF</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="icon" type="image/png" href="assets/Exafluence-favicon.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      min-height: 100vh;
      color: #2d3748;
    }

    .dashboard-page {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Top Navigation */
    .top-nav {
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding: 0 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 80px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo-section {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .nav-logo {
      height: 45px;
      width: auto;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.1));
    }

    .brand-title {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .nav-section {
      display: flex;
      list-style: none;
      gap: 5px;
      align-items: center;
    }

    .nav-section li a {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      text-decoration: none;
      color: #4a5568;
      font-weight: 500;
      border-radius: 12px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .nav-section li a::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(102, 126, 234, 0.1), transparent);
      transition: left 0.5s;
    }

    .nav-section li a:hover {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
      color: #667eea;
      transform: translateY(-1px);
    }

    .nav-section li a:hover::before {
      left: 100%;
    }

    .nav-section li a i {
      font-size: 16px;
    }

    /* Dashboard Content */
    .dashboard-content {
      flex: 1;
      padding: 40px 30px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      position: relative;
    }

    .dashboard-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(25px);
      border-radius: 24px;
      padding: 50px 45px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      max-width: 900px;
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    .dashboard-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #667eea, #764ba2, #f093fb);
      border-radius: 24px 24px 0 0;
    }

    .dashboard-card::after {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(102, 126, 234, 0.05) 0%, transparent 70%);
      animation: pulse 6s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.3; }
      50% { transform: scale(1.2) rotate(180deg); opacity: 0.1; }
    }

    #welcome {
      font-size: 36px;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 8px;
      text-align: center;
      letter-spacing: -0.5px;
      position: relative;
      z-index: 2;
    }

    .dashboard-card p {
      text-align: center;
      font-size: 18px;
      color: #718096;
      margin-bottom: 40px;
      position: relative;
      z-index: 2;
    }

    .dashboard-card p strong {
      color: #4a5568;
      font-weight: 600;
    }

    #role {
      color: #667eea;
      font-weight: 700;
      text-transform: capitalize;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Button Grid */
    .btn-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
      position: relative;
      z-index: 2;
    }

    .dashboard-button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 20px 25px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
    }

    .dashboard-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s;
    }

    .dashboard-button:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
      background: linear-gradient(135deg, #764ba2 0%, #f093fb 100%);
    }

    .dashboard-button:hover::before {
      left: 100%;
    }

    .dashboard-button:active {
      transform: translateY(-1px) scale(1);
    }

    /* Message Styling */
    #msg {
      margin-top: 20px;
      padding: 16px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      min-height: 20px;
      transition: all 0.3s ease;
      position: relative;
      z-index: 2;
    }

    #msg:not(:empty) {
      opacity: 1;
      transform: translateY(0);
    }

    #msg:empty {
      opacity: 0;
      transform: translateY(-10px);
    }

    /* Success and error message styles */
    #msg[style*="green"] {
      background: linear-gradient(135deg, #48bb78, #38a169);
      color: white;
      border: none;
      box-shadow: 0 8px 25px rgba(72, 187, 120, 0.3);
    }

    #msg[style*="red"] {
      background: linear-gradient(135deg, #f56565, #e53e3e);
      color: white;
      border: none;
      box-shadow: 0 8px 25px rgba(245, 101, 101, 0.3);
    }

    /* Floating Background Elements */
    .dashboard-content::before {
      content: '';
      position: absolute;
      top: 10%;
      left: 5%;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(102, 126, 234, 0.1) 0%, transparent 70%);
      border-radius: 50%;
      animation: float1 8s ease-in-out infinite;
      z-index: 0;
    }

    .dashboard-content::after {
      content: '';
      position: absolute;
      bottom: 10%;
      right: 5%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(240, 147, 251, 0.08) 0%, transparent 70%);
      border-radius: 50%;
      animation: float2 10s ease-in-out infinite reverse;
      z-index: 0;
    }

    @keyframes float1 {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(30px, -30px) rotate(120deg); }
      66% { transform: translate(-20px, 20px) rotate(240deg); }
    }

    @keyframes float2 {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(-40px, -40px) rotate(180deg); }
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .top-nav {
        padding: 0 20px;
        height: 70px;
        flex-direction: column;
        gap: 15px;
        height: auto;
        padding: 20px;
      }

      .nav-section {
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
      }

      .nav-section li a {
        padding: 8px 12px;
        font-size: 14px;
      }

      .dashboard-content {
        padding: 20px 15px;
      }

      .dashboard-card {
        padding: 30px 25px;
        margin: 0 10px;
      }

      #welcome {
        font-size: 28px;
      }

      .btn-grid {
        grid-template-columns: 1fr;
        gap: 15px;
      }

      .dashboard-button {
        padding: 18px 20px;
        font-size: 15px;
      }
    }

    @media (max-width: 480px) {
      .brand-title {
        font-size: 20px;
      }

      .nav-logo {
        height: 35px;
      }

      .dashboard-card {
        padding: 25px 20px;
      }

      #welcome {
        font-size: 24px;
      }

      .dashboard-card p {
        font-size: 16px;
      }
    }

    /* Hidden elements */
    .admin-only[style*="display: none"],
    .user-only[style*="display: none"] {
      display: none !important;
    }
  </style>
</head>
<body class="dashboard-page">

    <div class="top-nav">
        <div class="logo-section">
            <img src="assets/Ship2.jpg" class="nav-logo" alt="logo" />
            <span class="brand-title">SCMLITE</span>
        </div>
        <ul class="nav-section">
            <li><a href="/dashboard"><i class="fa-solid fa-table-columns"></i> Dashboard</a></li>
            <li><a href="/create-shipment"><i class="fa-solid fa-plus"></i> New Shipment</a></li>
            <li><a href="/shipments" class="admin-only"><i class="fa-solid fa-truck-fast"></i> Shipments</a></li>
            <li><a href="/my-shipments" class="user-only"><i class="fa-solid fa-box"></i> My Shipments</a></li>
            <li><a href="/manage-users" class="admin-only"><i class="fa-solid fa-users-gear"></i> Manage Users</a></li>
            <li><a href="/devicedata" class="admin-only"><i class="fa-solid fa-box"></i>Device Data</a></li>
            <li><a href="/account"><i class="fa-solid fa-user-circle"></i> Account</a></li>
            <li><a href="#" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
        </ul>
    </div>

    <div class="dashboard-content">
    <div class="dashboard-card">
      <h2 id="welcome">Welcome</h2>
      <p><strong>Role:</strong> <span id="role"></span></p>

      <div class="btn-grid" id="dashboard-actions">
        </div>

      <div id="msg"></div>
    </div>
  </div>

  <script>
    async function loadDashboard() {
      const msgBox = document.getElementById("msg");

      try {
        const res = await fetch("/api/account", {
          credentials: "include", // Ensures the cookie is sent
        });

        const data = await res.json();

        if (res.ok) {
          document.getElementById("welcome").textContent = `Welcome, ${data.username}`;
          document.getElementById("role").textContent = data.role;

          const actionContainer = document.getElementById("dashboard-actions");
          actionContainer.innerHTML = "";

          // Hide/Show sidebar items dynamically
          document.querySelectorAll(".admin-only").forEach(el => {
            if (data.role !== "admin") el.style.display = "none";
          });

          document.querySelectorAll(".user-only").forEach(el => {
            if (data.role !== "user") el.style.display = "none";
          });

          if (data.role === "admin") {
            actionContainer.innerHTML += `
              <button class="dashboard-button" onclick="location.href='/create-shipment'">Create Shipment</button>
              <button class="dashboard-button" onclick="location.href='/shipments'">Manage Shipments</button>
              <button class="dashboard-button" onclick="location.href='/manage-users'">Manage Users</button>
              <button class="dashboard-button" onclick="location.href='/devicedata'">Device Data</button>
            `;
          } else {
            actionContainer.innerHTML += `
              <button class="dashboard-button" onclick="location.href='/create-shipment'">Create Shipment</button>
              <button class="dashboard-button" onclick="location.href='/my-shipments'">My Shipments</button>
            `;
          }

        } else {
          msgBox.textContent = data.detail || "Failed to load dashboard.";
          setTimeout(() => window.location.href = "/login", 1500);
        }
      } catch (err) {
        msgBox.textContent = "Server error.";
        console.error(err);
        setTimeout(() => window.location.href = "/login", 1500);
      }
    }

    async function logout() {
      try {
        const res = await fetch("/api/logout", {
          method: "POST",
          credentials: "include",
        });

        const data = await res.json();

        if (res.ok) {
          alert("Logged out successfully.");
          window.location.href = "/login";
        } else {
          alert(data.message || "Logout failed.");
        }
      } catch (err) {
        console.error("Logout error:", err);
        alert("Something went wrong during logout.");
      }
    }

    loadDashboard();
  </script>
</body>
</html>
